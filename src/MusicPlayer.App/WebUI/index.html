<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Music Player</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar">
      <div class="brand"><div><b>Music Player</b><small>Local library</small></div></div>
      <nav id="navigation" aria-label="Main navigation">
        <div class="nav-section"><div class="nav-title">Discover</div>
          <button class="nav-item active" data-view="Home"><span data-icon="home"></span><span>Home</span></button>
          <button class="nav-item" data-view="Search"><span data-icon="search"></span><span>Search</span><kbd>Ctrl K</kbd></button>
          <button class="nav-item" data-view="Favorites"><span data-icon="heart"></span><span>Favorites</span></button>
        </div>
        <div class="nav-section"><div class="nav-title">Your Library</div>
          <button class="nav-item" data-view="Songs"><span data-icon="music"></span><span>Songs</span></button>
          <button class="nav-item" data-view="Albums"><span data-icon="disc"></span><span>Albums</span></button>
          <button class="nav-item" data-view="Artists"><span data-icon="users"></span><span>Artists</span></button>
          <button class="nav-item" data-view="Genres"><span data-icon="tag"></span><span>Genres</span></button>
          <button class="nav-item" data-view="Recently Added"><span data-icon="spark"></span><span>Recently Added</span></button>
        </div>
        <div class="nav-section"><div class="nav-title">Manage</div>
          <button class="nav-item" data-view="Playlists"><span data-icon="list"></span><span>Playlists</span></button>
          <button class="nav-item" data-view="Folders"><span data-icon="folder"></span><span>Folders</span></button>
        </div>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebarToggleBtn" title="Collapse sidebar" aria-label="Collapse sidebar" data-icon="panel-left"></button>
        <button class="icon-btn" id="backBtn" title="Back" aria-label="Back" data-icon="chevron-left"></button>
        <button class="icon-btn" id="forwardBtn" title="Forward" aria-label="Forward" data-icon="chevron-right"></button>
        <label class="search-box"><span data-icon="search"></span><input id="globalSearch" type="search" placeholder="Search songs, artists, albums, playlists…" autocomplete="off"><kbd>Ctrl K</kbd></label>
        <div class="top-spacer"></div>
        <button class="icon-btn" id="libraryRefresh" title="Library updated · refresh this view" aria-label="Refresh updated library" data-icon="refresh" hidden></button>
        <div class="scan-widget" id="scanWidget" hidden>
          <button class="icon-btn scan-ring" id="scanToggle" title="Library scan" aria-label="Show library scan details" aria-expanded="false" aria-controls="scanStrip"><svg viewBox="0 0 32 32" aria-hidden="true"><circle class="scan-ring-track" cx="16" cy="16" r="11"/><circle class="scan-ring-progress" cx="16" cy="16" r="11"/></svg></button>
          <div class="scan-strip" id="scanStrip" role="status" hidden><b id="scanHeading">Scanning library</b><span id="scanText"></span><div class="scan-actions"><button id="scanPause">Pause</button><button id="scanCancel">Cancel</button><button id="scanHide" aria-label="Hide scan details">Hide</button></div></div>
        </div>
        <button class="icon-btn panel-toggle" id="panelToggleBtn" title="Show Now Playing panel" aria-label="Show Now Playing panel" data-icon="queue"></button>
        <div class="top-menu-wrap">
          <button class="icon-btn top-menu-toggle" id="topMenuToggle" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false" data-icon="more"></button>
          <div class="top-menu" id="topMenu" role="menu" hidden>
            <button role="menuitem" data-view="Settings"><span data-icon="settings"></span> Settings</button>
            <button role="menuitem" data-action="scan"><span data-icon="refresh"></span> Scan library</button>
          </div>
        </div>
      </header>
      <div class="content" id="content" tabindex="-1"><div id="routeView"></div></div>
    </main>

    <aside class="now-panel" id="rightPanel" aria-label="Now Playing">
      <div class="panel-rail"><button class="icon-btn" id="panelExpand" title="Expand queue sidebar" aria-label="Expand queue sidebar" aria-controls="panelScroll" aria-expanded="false"><span data-icon="queue"></span><span class="panel-rail-count" id="panelRailCount" aria-hidden="true" hidden></span></button></div>
      <div class="panel-heading"><b>Now playing</b><button class="icon-btn panel-close" id="panelClose" title="Close panel" aria-label="Close panel" data-icon="close"></button></div>
      <div class="panel-scroll" id="panelScroll">
        <div class="panel-current" id="panelCurrent"></div>
        <div class="panel-tabs"><button class="active" data-panel="queue">Queue</button><button data-panel="info">Track info</button></div>
        <div class="panel-content" id="panelContent"></div>
      </div>
    </aside>

    <div class="resize-handle resize-sidebar" id="sidebarResize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div class="resize-handle resize-panel" id="panelResize" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize Now Playing panel"></div>

    <footer class="player">
      <div class="now"><div class="now-cover cover" id="nowCover"></div><div class="now-meta"><b id="nowTitle">Nothing playing</b><span id="nowArtist">Choose a song from your library</span></div><button class="ctrl heart" id="heartBtn" title="Favorite" aria-label="Favorite" data-icon="heart"></button></div>
      <div class="player-center"><div class="controls">
        <button class="ctrl" id="shuffleBtn" title="Shuffle" aria-label="Shuffle" data-icon="shuffle"></button>
        <button class="ctrl" id="prevBtn" title="Previous track" aria-label="Previous track" data-icon="skip-back"></button>
        <button class="ctrl play-main" id="playBtn" title="Play" aria-label="Play" data-icon="play"></button>
        <button class="ctrl" id="nextBtn" title="Next track" aria-label="Next track" data-icon="skip-forward"></button>
        <button class="ctrl" id="repeatBtn" title="Repeat off" aria-label="Repeat off" data-icon="repeat"></button>
        <button class="ctrl" id="abBtn" title="A–B repeat off" aria-label="A–B repeat off">A–B</button>
      </div><div class="timeline"><span id="currentTime">0:00</span><input id="progressRange" type="range" min="0" max="1" value="0" aria-label="Track position"><span id="totalTime">0:00</span></div></div>
      <div class="player-right"><button class="ctrl" data-view="Lyrics" title="Lyrics" aria-label="Lyrics" data-icon="lyrics"></button><button class="ctrl" data-view="Queue" title="Queue" aria-label="Queue" data-icon="queue"></button><button class="ctrl" data-view="Audio" title="Equalizer" aria-label="Equalizer" data-icon="equalizer"></button><button class="ctrl" id="immersiveToggle" title="Full-screen player" aria-label="Full-screen player" data-icon="expand"></button><div class="volume-control"><button class="ctrl" id="muteBtn" title="Mute" aria-label="Mute" data-icon="volume"></button><div class="volume-popover"><input id="volumeRange" type="range" min="0" max="100" value="75" aria-label="Volume"></div></div></div>
    </footer>
  </div>
  <section class="immersive-player" id="immersivePlayer" aria-label="Full-screen player" hidden>
    <div class="immersive-art-backdrop"><img id="immersiveBackdrop" alt=""></div>
    <div class="immersive-topbar"><span>NOW PLAYING</span><button class="immersive-exit" id="immersiveExit" aria-label="Exit full screen" title="Exit full screen"><span data-icon="minimize"></span><span>Exit full screen</span></button></div>
    <div class="immersive-content" id="immersiveContent">
      <div class="immersive-stage" id="immersiveStage">
        <div class="immersive-art-column">
          <div class="immersive-art" id="immersiveArtwork"></div>
          <div class="immersive-meta"><div><h1 id="immersiveTitle">Nothing playing</h1><p id="immersiveArtist">Choose a song from your library</p></div><button class="ctrl heart" id="immersiveHeart" aria-label="Add to favorites" title="Add to favorites" aria-pressed="false" data-icon="heart"></button></div>
        </div>
        <section class="immersive-lyrics" id="immersiveLyricsPanel" aria-label="Lyrics" aria-hidden="true" inert>
          <header><div class="immersive-lyrics-heading">Lyrics <span class="immersive-lyric-source" id="immersiveLyricsSource"></span></div><button class="ctrl immersive-lyrics-close" id="immersiveLyricsClose" aria-label="Hide lyrics" title="Hide lyrics" data-icon="close"></button></header>
          <div class="immersive-lyrics-scroll" id="immersiveLyricsScroll"><div class="lyrics-lines" id="immersiveLyricsLines"></div></div>
        </section>
      </div>
      <div class="immersive-timeline"><div class="immersive-time-labels"><span id="immersiveCurrentTime">0:00</span><span id="immersiveTotalTime">0:00</span></div><input id="immersiveProgress" type="range" min="0" max="1" value="0" aria-label="Track position"></div>
      <div class="immersive-controls"><button class="ctrl" id="immersivePrev" aria-label="Previous track" title="Previous track" data-icon="skip-back"></button><button class="ctrl immersive-play" id="immersivePlay" aria-label="Play" title="Play" data-icon="play"></button><button class="ctrl" id="immersiveNext" aria-label="Next track" title="Next track" data-icon="skip-forward"></button></div>
      <div class="immersive-shortcuts"><button class="ctrl" data-view="Audio" title="Equalizer" aria-label="Equalizer" data-icon="equalizer"></button><button class="ctrl immersive-lyrics-toggle" id="immersiveLyricsToggle" title="Show lyrics" aria-label="Show lyrics" aria-expanded="false" aria-controls="immersiveLyricsPanel" data-icon="lyrics"></button><button class="ctrl" data-view="Queue" title="Queue" aria-label="Queue" data-icon="queue"></button></div>
    </div>
    <section class="immersive-drawer" id="immersiveDrawer" aria-label="Full-screen controls" hidden><header><h2 id="immersiveDrawerTitle">Queue</h2><button class="icon-btn" id="immersiveDrawerClose" title="Close panel" aria-label="Close panel" data-icon="close"></button></header><div id="immersiveDrawerBody"></div></section>
  </section>
  <div class="context-menu" id="contextMenu" role="menu"></div>
  <div class="modal-layer" id="modalLayer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" aria-label="Close" data-icon="close"></button></header><div class="modal-body" id="modalBody"></div><footer id="modalActions"></footer></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
