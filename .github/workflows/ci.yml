name: Windows CI

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    name: Rust · Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Provision LibVLC 3.0.24 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vlcDir = Join-Path $env:ProgramFiles 'VideoLAN\VLC'
          if (-not (Test-Path (Join-Path $vlcDir 'libvlc.dll'))) {
            $pkgPath = Join-Path $env:RUNNER_TEMP 'libvlc-3.0.24.zip'
            $extractDir = Join-Path $env:RUNNER_TEMP 'vlc-extract'
            curl.exe -fSL --retry 3 -o $pkgPath 'https://api.nuget.org/v3-flatcontainer/videolan.libvlc.windows/3.0.24/videolan.libvlc.windows.3.0.24.nupkg'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to download VideoLAN.LibVLC.Windows 3.0.24' }
            7z x $pkgPath 'build/x64/*' "-o$extractDir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to extract LibVLC runtime' }
            $src = Join-Path $extractDir 'build\x64'
            New-Item -ItemType Directory -Force -Path $vlcDir | Out-Null
            Copy-Item -Path (Join-Path $src '*') -Destination $vlcDir -Recurse -Force
          }
      - name: Check all workspace targets
        run: cargo check --all-targets
      - name: Run workspace unit, integration, and benchmark tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release --bin music-player-app
      - name: Validate release metadata
        shell: pwsh
        run: ./packaging/windows/Test-ReleaseMetadata.ps1
      - name: Upload release executable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: music-player-rust-win-x64
          path: target/release/music-player-app.exe
          if-no-files-found: error

  legacy-core-tests:
    name: Legacy .NET Core Tests · Linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore legacy core tests
        run: dotnet restore legacy/tests/MusicPlayer.Tests/MusicPlayer.Tests.csproj
      - name: Run legacy core tests
        run: dotnet test legacy/tests/MusicPlayer.Tests/MusicPlayer.Tests.csproj --configuration Release --no-restore
      - name: Run legacy WebUI JS unit tests
        run: node --test legacy/tests/MusicPlayer.Ui.Tests/lyrics-theme.test.mjs legacy/tests/MusicPlayer.Ui.Tests/library-pagination.test.mjs
