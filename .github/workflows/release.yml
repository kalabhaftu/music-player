name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or version to build as a draft release (e.g. v2.0.0)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-win-x64:
    name: Build & Package · Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve version and validate metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $refTag = if ('${{ github.event.inputs.tag }}' -ne '') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $refTag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$version' from ref '$refTag'."
          }
          & ./packaging/windows/Test-ReleaseMetadata.ps1 -ExpectedVersion $version
          "tag=$refTag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Provision LibVLC 3.0.24 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vlcDir = Join-Path $env:ProgramFiles 'VideoLAN\VLC'
          $releaseDir = Join-Path $PWD 'target\release'
          New-Item -ItemType Directory -Force -Path $vlcDir, $releaseDir | Out-Null
          $pkgPath = Join-Path $env:RUNNER_TEMP 'libvlc-3.0.24.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'vlc-extract'
          curl.exe -fSL --retry 3 -o $pkgPath 'https://api.nuget.org/v3-flatcontainer/videolan.libvlc.windows/3.0.24/videolan.libvlc.windows.3.0.24.nupkg'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download VideoLAN.LibVLC.Windows 3.0.24' }
          7z x $pkgPath 'build/x64/*' "-o$extractDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract LibVLC runtime' }
          $src = Join-Path $extractDir 'build\x64'
          foreach ($dest in @($vlcDir, $releaseDir)) {
            Copy-Item -Path (Join-Path $src '*') -Destination $dest -Recurse -Force
          }

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release executable
        run: cargo build --release --bin music-player-app

      - name: Build Inno Setup installer and portable ZIP
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.MUSICPLAYER_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MUSICPLAYER_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.meta.outputs.version }}'
          $outDir = Join-Path $PWD 'artifacts/release-assets'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $skipSigning = [string]::IsNullOrWhiteSpace($env:SIGNING_PFX)
          if ($skipSigning) {
            & ./packaging/windows/Build-LocalInstaller.ps1 -Version $version -SkipSigning
          } else {
            & ./packaging/windows/Build-LocalInstaller.ps1 -Version $version
          }

          $setupSrc = Join-Path $PWD 'artifacts/local-installer/MusicPlayer-Setup-x64.exe'
          if (!(Test-Path $setupSrc)) { throw "Installer not found at $setupSrc" }
          Copy-Item -LiteralPath $setupSrc -Destination (Join-Path $outDir 'MusicPlayer-Setup-x64.exe') -Force

          $payloadDir = Join-Path $PWD 'artifacts/local-installer/payload-x64'
          $portableStage = Join-Path $PWD "artifacts/MusicPlayer-$version-win-x64-portable"
          & ./packaging/windows/Prepare-PortablePackage.ps1 -PublishDirectory $payloadDir -DestinationDirectory $portableStage -Version $version -Architecture 'x64'
          Compress-Archive -Path "$portableStage\*" -DestinationPath (Join-Path $outDir 'MusicPlayer-Portable-win-x64.zip') -Force

          Push-Location $outDir
          try {
            $lines = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
            $lines | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
          } finally {
            Pop-Location
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.meta.outputs.tag }}'
          $version = '${{ steps.meta.outputs.version }}'
          $outDir = Join-Path $PWD 'artifacts/release-assets'

          $notesFile = Join-Path $PWD 'artifacts/release-notes.md'
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $pattern = "(?ms)^## \[\Q$version\E\].*?(?=^## \[|\z)"
          if ($changelog -match $pattern) {
            $matches[0].Trim() | Set-Content -LiteralPath $notesFile -Encoding utf8
          } else {
            "Release $tag" | Set-Content -LiteralPath $notesFile -Encoding utf8
          }

          $assets = @(
            (Join-Path $outDir 'MusicPlayer-Setup-x64.exe'),
            (Join-Path $outDir 'MusicPlayer-Portable-win-x64.zip'),
            (Join-Path $outDir 'SHA256SUMS.txt')
          )
          $isPrerelease = $version -match '-'
          if ($isPrerelease) {
            gh release create $tag @assets --title "Music Player $tag" --notes-file $notesFile --prerelease
          } else {
            gh release create $tag @assets --title "Music Player $tag" --notes-file $notesFile
          }
